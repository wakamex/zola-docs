title = "Zola Docs theme"
description = "A runnable demonstration of the Zola Docs documentation theme."
base_url = "http://127.0.0.1:1111"
compile_sass = false
build_search_index = true
generate_sitemap = false
generate_robots_txt = false

[markdown]
insert_anchor_links = "right"

[search]
index_format = "fuse_json"
include_title = true
include_content = true
include_path = true

[extra.zola_docs]
site_name = "Zola Docs"
home_url = "/"
navigation_path = "data/navigation.json"
navigation_label = "Documentation"
search_enabled = true
search_label = "Search documentation"
search_placeholder = "Search the demo"
search_index = "search_index.en.json"
search_results_limit = 10
copy_code = true
page_navigation = true
breadcrumbs = true
toc = true
content_max_width = "78rem"
backlinks = true
backlinks_label = "Referenced by"
edit_url = "https://github.com/example/docs/edit"
edit_branch = "main"
edit_label = "Edit this page"
last_updated = true
last_updated_label = "Last updated"
previous_label = "Previous"
next_label = "Next"
appearance_selector = true
appearance_label = "Theme"
metadata = true
social_image = ""
mermaid = true
mermaid_url = "https://cdn.jsdelivr.net/npm/mermaid@11.12.0/+esm"
versions_enabled = true
versions_path = "data/versions.json"
version_label = "Documentation version"
current_version = "stable"
version_banner = ""
version_preserve_path = true
favicon = ""
extra_styles = []
