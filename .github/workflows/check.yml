name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  theme:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zola: ["0.23.0", "0.23.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install Zola ${{ matrix.zola }}
        env:
          ZOLA_VERSION: ${{ matrix.zola }}
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar --extract --gzip --directory "$RUNNER_TEMP"
      - name: Validate theme
        run: uv --no-config run --locked python tests/check.py --zola "$RUNNER_TEMP/zola"
